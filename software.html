<style>
@font-face {

@font-face {

:root {
  --bg: #ffffff;

}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212;
    --fg: #e0e0e0;
    --link: #8ab4f8;
    --visited: #c58af9;
    --meta: #aaaaaa;
    --border: #333333;
    --pinned: #ff7b72;
    --pinned-bg: #1a1a1a;
  }
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  color: var(--fg);
  font-family: "JetBrains Mono", monospace;
  font-size: 14px;
  line-height: 1.5;
  width: 1200px;
  max-width: 100%;
  margin: 0 auto;
  padding: 1rem;
  min-height: 100vh;
}
a { color: var(--link); }
a:visited { color: var(--visited); }

.nav a.active { font-weight: bold; }
.logo {
  font-weight: bold;
  font-size: 1.1em;
  letter-spacing: 2px;
  color: var(--fg);
  cursor: default;
  user-select: none;
  text-decoration: none;
}
hr {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 0.8rem 0;
}
.sub-nav {
  margin: 1rem 0;
  font-size: 0.95em;
  color: var(--meta);
}
.sub-nav a {
  text-decoration: none;
  color: var(--meta);
  margin-right: 0.6rem;
}
.sub-nav a:hover { text-decoration: underline; }
.sub-nav a.active { color: var(--fg); font-weight: bold; }
.split-view {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  margin-top: 1rem;
  align-items: flex-start;
}
.col-main {
  flex: 3 1 500px;
  padding: 1rem;
}
.col-side {
  flex: 1 1 250px;
  max-width: 350px;
  background-color: var(--pinned-bg);
  padding: 1rem;
}
.col-side.hidden { display: none; }
.col-title {
  font-size: 1em;
  font-weight: bold;
  color: var(--fg);
  margin-bottom: 1rem;
}
.page-info {
  font-size: 0.9em;
  color: var(--meta);
  margin-bottom: 1rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
}
ul.mail-list {
  list-style-type: none;
  padding: 0;
  margin: 0;
}
ul.mail-list li { margin-bottom: 1.2rem; }
.meta {
  color: var(--meta);
  font-size: 0.9em;
  margin-bottom: 0.2rem;
}
.subject { margin-left: 1rem; }
.pinned-tag {
  color: var(--pinned);
  font-weight: bold;
}
.pagination {
  margin-top: 2rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
  font-size: 0.95em;
  color: var(--meta);
}
.pagination a, .pagination span { margin-right: 0.5rem; }
.pagination .current { font-weight: bold; color: var(--fg); }
.pagination .disabled { color: var(--border); cursor: not-allowed; }
