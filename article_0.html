<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>test — ClayKit</title>
<style>
@font-face {
  font-family: "JetBrains Mono";
  font-style: normal;
  font-weight: 400;
  src: url("https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2") format("woff2");
}
@font-face {
  font-family: "JetBrains Mono";
  font-style: normal;
  font-weight: 700;
  src: url("https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2") format("woff2");
}
:root {
  --bg: #ffffff;
  --fg: #000000;
  --link: #0000ee;
  --visited: #551a8b;
  --meta: #666666;
  --border: #e5e5e5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212;
    --fg: #e0e0e0;
    --link: #8ab4f8;
    --visited: #c58af9;
    --meta: #aaaaaa;
    --border: #333333;
  }
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  color: var(--fg);
  font-family: "JetBrains Mono", monospace;
  font-size: 14px;
  line-height: 1.5;
  width: 1200px;
  max-width: 100%;
  margin: 0 auto;
  padding: 1rem;
  min-height: 100vh;
}
a { color: var(--link); }
a:visited { color: var(--visited); }
.nav {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  margin-bottom: 0.5rem;
}
.nav a { text-decoration: none; }
.nav a.active { font-weight: bold; }
.logo {
  font-weight: bold;
  font-size: 1.1em;
  letter-spacing: 2px;
  color: var(--fg);
  cursor: default;
  user-select: none;
  text-decoration: none;
}
hr {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 0.8rem 0;
}
.content { flex: 1; }
.mail-article { margin-bottom: 3rem; }
.mail-header { margin-bottom: 1.5rem; }
.mail-header h1 {
  font-size: 1.5em;
  font-weight: 600;
  margin: 0 0 0.4rem 0;
  line-height: 1.3;
  word-break: break-word;
}
.mail-meta {
  font-size: 0.9em;
  color: var(--meta);
}
pre.body {
  white-space: pre-wrap;
  word-break: break-word;
  margin: 0;
  font-family: "JetBrains Mono", monospace;
  font-size: 0.95em;
  color: var(--fg);
}
.mail-separator {
  border: 0;
  border-top: 1px dashed var(--border);
  margin: 2.5rem 0;
}
</style>
</head>
<body>

<div class="nav">
  <a class="logo" href="index.html">ClayKit</a>
  <a class="active" href="article.html">Article</a>
</div>

<hr>

<div class="content">
<article class="mail-article"><header class="mail-header"><h1>test</h1><div class="mail-meta">test / 2026-10-24 16:33 / article:0</div></header><pre class="body">test
</pre></article>
</div>

</body>
</html>
